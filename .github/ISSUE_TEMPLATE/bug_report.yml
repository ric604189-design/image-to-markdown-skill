name: Bug report
description: Report a reproducible problem without uploading private OCR input.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private documents, or OCR output."
  - type: input
    id: revision
    attributes:
      label: Revision or release
      description: Commit SHA or release tag.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a sanitized fixture or describe the input shape.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
